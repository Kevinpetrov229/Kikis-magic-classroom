    <!--
      THESIS: Chinese phrases are carved stone; a sentence is stamped, not typed. This refuses the
      neutral spreadsheet-and-yellow-chip arrangement every sentence-builder tool ships.
      OWN-WORLD: 印谱 seal-impression album. Cool pale stone ground (#E7EAE1), 朱砂 vermilion (#C9291B)
      committing as whole fields, 墨 ink (#191F1C), 石青 teal annotation, 藤黄 gamboge for score only.
      界格 hairline rules. Hanzi in Noto Serif SC is the display face; Latin recedes to small tracked Archivo.
      阳刻 stone face / 阴刻 vermilion field are the two control states.
      STORY: A teacher sees her own table generating correct Chinese, presses one chunk, watches it stamp,
      and understands the whole product before reading a word of explanation.
      FIRST VIEWPORT: Nameplate seal top-left with one line of purpose and a vermilion "author" seal as
      the primary action; the live Buying-gifts table dominating the centre in ruled stone cells; the
      sentence line directly beneath it as wet vermilion impressions with blind-embossed empty slots;
      the nine activities as a numbered type index down the right rail.
      FORM: 印谱 seal album — candidate 6 of 7 grounded directions; seed key 428b65da.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance.
    -->
